<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ontrack</title>
    <meta name="description" content="Calorie and training tracker" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0c0e" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ontrack" />
    <script>
      // Theme and text size before first paint, so there is no flash. Same key and mapping as src/lib/prefs.svelte.ts.
      try {
        var ui = JSON.parse(localStorage.getItem('ot-ui') || '{}');
        var t = ui.theme || 'system';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        var lvl = ui.fontSize || 'system';
        if (lvl === 'system') {
          var pr = document.createElement('span'); pr.style.cssText = 'position:absolute;visibility:hidden;font:-apple-system-body';
          var apple = pr.style.font !== ''; if (!apple) pr.style.cssText = 'position:absolute;visibility:hidden;font-size:medium';
          document.documentElement.appendChild(pr); var px = parseFloat(getComputedStyle(pr).fontSize) || 16; pr.remove();
          var b = apple ? 17 : 16; lvl = px <= b ? 'm' : px <= b + 3 ? 'l' : 'xl';
        }
        document.documentElement.style.setProperty('--fs', String({ m: 1, l: 1.15, xl: 1.3 }[lvl] || 1));
        document.documentElement.dataset.fs = lvl;
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Ontrack needs JavaScript. Turn it on in your browser settings.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
